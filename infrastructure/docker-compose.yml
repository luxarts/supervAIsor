services:
  backend:
    build:
      context: ..
      dockerfile: infrastructure/backend.Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - supervaisor-data:/var/lib/supervaisor
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  supervaisor-data:
